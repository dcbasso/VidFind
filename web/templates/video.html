<!DOCTYPE html>
<html lang="pt-BR" data-theme="nocturne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidFind · Vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/static/i18n.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens: 5 roles per theme; ramps derived by formula ─────────── */
    :root, [data-theme="nocturne"] {
      --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
      --color-accent: #9184d9; --color-accent-2: #a7a1db;
    }
    [data-theme="ocean"] {
      --color-bg: #0b0f17; --color-surface: #121826; --color-text: #d4dced;
      --color-accent: #4fd8c4; --color-accent-2: #5ec2e0;
    }
    [data-theme="palenight"] {
      --color-bg: #1b1e2b; --color-surface: #242840; --color-text: #eae9f5;
      --color-accent: #c895ea; --color-accent-2: #f07bb0;
    }
    [data-theme="onedark"] {
      --color-bg: #21252b; --color-surface: #282c34; --color-text: #c7ccd6;
      --color-accent: #61afef; --color-accent-2: #e5c07b;
    }
    :root {
      --color-accent-100: color-mix(in srgb, var(--color-accent) 16%, white);
      --color-accent-800: color-mix(in srgb, var(--color-accent) 40%, black);
      --color-neutral-700: color-mix(in srgb, var(--color-text) 28%, var(--color-bg));
      --color-neutral-500: color-mix(in srgb, var(--color-text) 58%, var(--color-bg));
      --color-neutral-400: color-mix(in srgb, var(--color-text) 72%, var(--color-bg));
      --color-divider: color-mix(in srgb, var(--color-text) 16%, transparent);

      --font-heading: 'Inter', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;

      /* Compatibility aliases so existing component CSS keeps working */
      --bg: var(--color-bg);
      --surface: var(--color-surface);
      --surface2: color-mix(in srgb, var(--color-text) 6%, var(--color-surface));
      --border: var(--color-divider);
      --border2: var(--color-neutral-700);
      --accent: var(--color-accent);
      --accent-dim: var(--color-neutral-400);
      --text: var(--color-text);
      --muted: var(--color-neutral-500);
      --tab-bar-bg: color-mix(in srgb, var(--color-text) 3%, var(--color-bg));
      --tab-active-bg: var(--color-bg);
    }

    /* ── Base ─────────────────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── Shell: header + content + footer, 100vh ─────────────────────────── */
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .logo-wrap { display: flex; align-items: center; }
    .logo-wrap img { height: 32px; width: auto; }
    .logo-fallback { font-family: var(--font-heading); font-size: 1.4rem; letter-spacing: 0.12em; color: var(--text); }
    .header-title { font-family: var(--font-heading); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-btn {
      background: none; border: 1px solid var(--border); border-radius: 2px;
      color: var(--muted); font-family: var(--font-heading);
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 5px 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .theme-btn:hover { border-color: var(--accent-dim); color: var(--text); }

    /* ── Video layout (fills the 1fr row) ────────────────────────────────── */
    .video-layout {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* Player */
    .player-wrap { background: #000; flex-shrink: 0; }
    #video-player { width: 100%; max-height: 54vh; display: block; }

    /* Info bar */
    .video-info-bar {
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .video-info-text { flex: 1; min-width: 0; }
    .video-folder {
      font-family: var(--font-heading);
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .video-name {
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .video-info-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

    /* ── Detail tab bar ───────────────────────────────────────────────────── */
    .detail-tab-bar {
      background: var(--tab-bar-bg);
      border-bottom: 2px solid var(--border2);
      padding: 0 32px;
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 44px;
      flex-shrink: 0;
    }
    .detail-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: var(--muted);
      font-family: var(--font-heading);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      padding: 7px 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-bottom: -2px;
    }
    .detail-tab:hover { color: var(--text); background: var(--surface2); }
    .detail-tab.active {
      color: var(--text);
      background: var(--tab-active-bg);
      border-color: var(--border2);
      border-bottom: 2px solid var(--tab-active-bg);
    }

    /* ── Detail content panes ────────────────────────────────────────────── */
    .detail-pane {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .detail-pane::-webkit-scrollbar { width: 4px; }
    .detail-pane::-webkit-scrollbar-thumb { background: var(--border2); }
    .detail-pane.hidden { display: none; }

    /* Subtitle rows */
    .sub-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 0 16px;
      padding: 10px 32px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .sub-row:hover { background: var(--surface2); }
    .sub-row.active { background: var(--surface2); border-left: 2px solid var(--accent); padding-left: 30px; }
    .sub-ts {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding-top: 2px;
    }
    .sub-row.active .sub-ts { color: var(--accent-dim); }
    .sub-text { font-size: 0.92rem; color: var(--muted); font-weight: 300; line-height: 1.5; }
    .sub-row:hover .sub-text,
    .sub-row.active .sub-text { color: var(--text); }

    /* Scene rows */
    .scene-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 0 16px;
      padding: 12px 32px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .scene-row:hover { background: var(--surface2); }
    .scene-ts {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding-top: 2px;
    }
    .scene-desc { font-size: 0.92rem; color: var(--muted); font-weight: 300; line-height: 1.55; }
    .scene-row:hover .scene-desc { color: var(--text); }

    /* Metadata pane */
    .res-tab-bar {
      display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid var(--border);
    }
    .res-tab {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: var(--font-heading); font-size: 0.78rem; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 8px 14px; border-bottom: 2px solid transparent;
    }
    .res-tab:hover { color: var(--text); }
    .res-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .meta-group { padding: 24px 32px; border-bottom: 1px solid var(--border); }
    .meta-group:last-child { border-bottom: none; }
    .meta-group h3 {
      font-family: var(--font-heading); font-size: 0.82rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent-dim); margin-bottom: 12px; font-weight: 400;
    }
    .meta-row {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-label { font-size: 0.85rem; color: var(--muted); }
    .meta-value { font-size: 0.85rem; color: var(--text); font-weight: 500; text-align: right; }

    /* ── State / loading ─────────────────────────────────────────────────── */
    .state-msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 160px; gap: 12px; color: var(--muted);
    }
    .state-msg p { font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; font-family: var(--font-heading); }
    .loading { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 60px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); animation: pulse 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    /* ── Action buttons ───────────────────────────────────────────────────── */
    .action-btn {
      background: none; border: 1px solid var(--border2); color: var(--accent-dim);
      border-radius: 2px; padding: 5px 12px; font-size: 0.72rem;
      font-family: var(--font-heading); cursor: pointer; letter-spacing: 0.06em;
      text-transform: uppercase; transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(128,128,128,0.08); }

    /* ── Download resolution menu (floating) ─────────────────────────────── */
    .dl-menu {
      position: fixed; min-width: 168px; background: var(--surface);
      border: 1px solid var(--border2); border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35); padding: 6px; z-index: 60;
    }
    .dl-opt {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 9px;
      border-radius: 3px; border: none; background: transparent;
      cursor: pointer; font: inherit; color: var(--text); text-align: left; text-decoration: none;
    }
    .dl-opt:hover { background: var(--surface2); }
    .dl-opt .dl-lbl { flex: 1; font-size: 13px; font-family: var(--font-heading); }
    .dl-opt .dl-size { font-size: 11px; color: var(--muted); }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 0 40px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
    }
    .footer-left { font-family: var(--font-heading); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .footer-right { font-family: var(--font-heading); font-size: 0.62rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .footer-right a { color: var(--muted); text-decoration: none; transition: color 0.15s; text-transform: uppercase; letter-spacing: 0.08em; }
    .footer-right a:hover { color: var(--text); }
    .sep { color: var(--border2); }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      header, footer { padding: 0 20px; }
      .video-info-bar { padding: 12px 20px; flex-direction: column; align-items: flex-start; height: auto; }
      .detail-tab-bar { padding: 0 16px; }
      .sub-row, .scene-row { grid-template-columns: 80px 1fr; padding: 10px 16px; }
      .sub-row.active { padding-left: 14px; }
      #video-player { max-height: 40vh; }
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo-wrap">
      <img id="header-logo" src="" alt="Logo" style="display:none">
      <span id="header-logo-fallback" class="logo-fallback">VidFind</span>
    </div>
    <span class="header-title hidden" id="header-title"></span>
    <div class="header-right">
      <a href="/" id="btn-back" class="action-btn">← <span data-i18n="video.back">Voltar</span></a>
      <button class="theme-btn" id="lang-toggle">🌐 <span id="lang-code">PT</span></button>
      <button class="theme-btn" id="theme-toggle">◐ <span data-i18n="video.theme">Tema</span></button>
    </div>
  </header>

  <div class="video-layout">

    <div class="player-wrap">
      <video id="video-player" controls></video>
    </div>

    <div class="video-info-bar">
      <div class="video-info-text">
        <div class="video-folder" id="detail-folder">—</div>
        <div class="video-name" id="detail-name">Carregando…</div>
      </div>
      <div class="video-info-actions">
        <a id="btn-dl-srt"    class="action-btn" href="#" download>↓ <span data-i18n="video.dlSrt">SRT</span></a>
        <a id="btn-dl-txt"    class="action-btn" href="#" download>↓ <span data-i18n="video.dlTxt">TXT</span></a>
        <a id="btn-dl-scenes" class="action-btn" href="#" download>↓ <span data-i18n="video.dlScenes">Cenas</span></a>
        <button id="btn-dl-video" class="action-btn" type="button">↓ <span data-i18n="video.dlVideo">Vídeo</span></button>
      </div>
    </div>

    <nav class="detail-tab-bar">
      <button class="detail-tab active" data-pane="subtitles">≡ <span data-i18n="video.tabSubtitle">Legenda</span></button>
      <button class="detail-tab" data-pane="scenes">⬡ <span data-i18n="video.tabScenes">Cenas</span></button>
      <button class="detail-tab" data-pane="metadata">◫ <span data-i18n="video.tabMetadata">Metadados</span></button>
    </nav>

    <div class="detail-pane" id="pane-subtitles">
      <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <div class="detail-pane hidden" id="pane-scenes">
      <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <div class="detail-pane hidden" id="pane-metadata">
      <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

  </div>

  <footer>
    <div class="footer-left" id="footer-left"><a href="https://github.com/dcbasso/VidFind" target="_blank" rel="noopener">VidFind</a> · <span data-i18n="video.footer">Detalhe do Vídeo</span></div>
    <div class="footer-right">
      <span>Powered by</span>
      <a href="https://dantebasso.com.br" target="_blank" rel="noopener">Dante Basso</a>
      <span class="sep">·</span>
      <a href="https://dantebasso.com.br" target="_blank" rel="noopener">dantebasso.com.br</a>
    </div>
  </footer>

</div>

<script>
  // ── Utils ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function loading() {
    return `<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  }

  // ── Theme ─────────────────────────────────────────────────────────────────
  const THEMES = ["nocturne", "ocean", "palenight", "onedark"];
  let themeIndex = 0;

  function applyTheme(t) {
    if (!THEMES.includes(t)) t = "nocturne";
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("vf-theme", t);
    themeIndex = Math.max(0, THEMES.indexOf(t));
  }

  const savedTheme = localStorage.getItem("vf-theme");
  if (savedTheme && THEMES.includes(savedTheme)) applyTheme(savedTheme);

  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(THEMES[(themeIndex + 1) % THEMES.length]);
  });

  // ── i18n ──────────────────────────────────────────────────────────────────
  VFI18N.init();
  document.getElementById("lang-code").textContent = VFI18N.lang.toUpperCase();
  document.getElementById("detail-name").textContent = t("video.loading");
  VFI18N.applyStatic();
  document.getElementById("lang-toggle").addEventListener("click", () => {
    const ids = VFI18N.langs.map(l => l.id);
    VFI18N.setLang(ids[(ids.indexOf(VFI18N.lang) + 1) % ids.length]);
  });
  VFI18N.onChange(() => {
    document.getElementById("lang-code").textContent = VFI18N.lang.toUpperCase();
    VFI18N.applyStatic();
  });

  // ── Folder display ────────────────────────────────────────────────────────
  let resolutionTokens = ["4k", "1080p", "720p", "RAW"];
  let hiddenFolderSegments = [];
  function dispFolder(f) {
    if (!f || f === ".") return f;
    let parts = f.split("/");
    if (parts.length > 1 && resolutionTokens.some(t => t.toLowerCase() === parts[0].toLowerCase())) {
      parts = parts.slice(1);
    }
    parts = parts.filter(p => !hiddenFolderSegments.some(h => h.toLowerCase() === p.toLowerCase()));
    return parts.join("/") || ".";
  }

  // ── Config ────────────────────────────────────────────────────────────────
  fetch("/api/config").then(r => r.json()).then(cfg => {
    if (Array.isArray(cfg.resolutions) && cfg.resolutions.length) resolutionTokens = cfg.resolutions;
    if (Array.isArray(cfg.hidden_folder_segments)) hiddenFolderSegments = cfg.hidden_folder_segments;
    if (cfg.logo_url) {
      const img = document.getElementById("header-logo");
      img.src = cfg.logo_url;
      img.style.display = "block";
      const fallback = document.getElementById("header-logo-fallback");
      fallback.style.display = "none";
      img.onerror = () => {
        img.style.display = "none";
        fallback.style.display = "block";
        if (cfg.title) fallback.textContent = cfg.title;
      };
    } else if (cfg.title) {
      document.getElementById("header-logo-fallback").textContent = cfg.title;
    }
    if (!savedTheme && cfg.theme && THEMES.includes(cfg.theme)) applyTheme(cfg.theme);
    if (!VFI18N.hasSaved() && cfg.lang) VFI18N.setLang(cfg.lang);
  }).catch(() => {});

  // ── Back button ───────────────────────────────────────────────────────────
  document.getElementById("btn-back").addEventListener("click", e => {
    e.preventDefault();
    if (document.referrer && new URL(document.referrer).origin === location.origin) {
      history.back();
    } else {
      location.href = "/";
    }
  });

  // ── URL params ────────────────────────────────────────────────────────────
  const params    = new URLSearchParams(location.search);
  const videoPath = params.get("path") || "";
  const startSec  = parseFloat(params.get("t") || "0") || 0;

  if (!videoPath) {
    document.getElementById("detail-name").textContent = t("video.missingPath");
  }

  // ── Player setup ──────────────────────────────────────────────────────────
  const player = document.getElementById("video-player");
  const vp     = encodeURIComponent(videoPath);

  player.src = `/api/video?path=${vp}`;

  if (startSec > 0) {
    player.addEventListener("loadedmetadata", () => {
      player.currentTime = Math.max(0, startSec - 1);
    }, { once: true });
  }

  // ── Download links ────────────────────────────────────────────────────────
  document.getElementById("btn-dl-srt").href    = `/api/subtitle?video_path=${vp}`;
  document.getElementById("btn-dl-txt").href    = `/api/transcript/txt?video_path=${vp}`;
  document.getElementById("btn-dl-scenes").href = `/api/scenes/txt?video_path=${vp}`;
  // ── Download resolution picker ───────────────────────────────────────────
  let dlMenuEl = null;
  let resolutionVariants = null; // cached [{token,label,path,size}], shared with metadata pane
  function fetchResolutionVariants() {
    if (resolutionVariants) return Promise.resolve(resolutionVariants);
    return fetch(`/api/resolutions?video_path=${vp}`)
      .then(r => r.json())
      .then(data => resolutionVariants = (data && data.variants) || []);
  }
  function closeDownloadMenu() {
    if (dlMenuEl) { dlMenuEl.remove(); dlMenuEl = null; }
  }
  function triggerDownload(path) {
    const a = document.createElement("a");
    a.href = `/api/video?path=${encodeURIComponent(path)}&download=1`;
    a.download = "";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function fmtBytes(n) {
    if (!n && n !== 0) return "—";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
  }
  document.getElementById("btn-dl-video").addEventListener("click", (e) => {
    closeDownloadMenu();
    const btn = e.currentTarget;
    fetchResolutionVariants()
      .then(variants => {
        if (variants.length <= 1) {
          triggerDownload(variants[0] ? variants[0].path : videoPath);
          return;
        }
        const menu = document.createElement("div");
        menu.className = "dl-menu";
        menu.innerHTML = variants.map(v => `
          <button class="dl-opt" data-path="${escHtml(v.path)}">
            <span class="dl-lbl">${escHtml(v.label)}</span>
            <span class="dl-size">${fmtBytes(v.size)}</span>
          </button>`).join("");
        document.body.appendChild(menu);
        const rect = btn.getBoundingClientRect();
        menu.style.top = `${rect.bottom + 6}px`;
        menu.style.left = `${Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12)}px`;
        menu.addEventListener("click", (e2) => {
          const opt = e2.target.closest(".dl-opt");
          if (!opt) return;
          e2.stopPropagation();
          triggerDownload(opt.dataset.path);
          closeDownloadMenu();
        });
        dlMenuEl = menu;
      })
      .catch(() => triggerDownload(videoPath));
  });
  document.addEventListener("click", (e) => {
    if (dlMenuEl && !e.target.closest(".dl-menu") && e.target.id !== "btn-dl-video") closeDownloadMenu();
  });
  window.addEventListener("scroll", closeDownloadMenu, true);
  window.addEventListener("resize", closeDownloadMenu);

  // ── Tabs ──────────────────────────────────────────────────────────────────
  document.querySelector(".detail-tab-bar").addEventListener("click", e => {
    const tab = e.target.closest(".detail-tab");
    if (!tab) return;
    document.querySelectorAll(".detail-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const pane = tab.dataset.pane;
    document.getElementById("pane-subtitles").classList.toggle("hidden", pane !== "subtitles");
    document.getElementById("pane-scenes").classList.toggle("hidden", pane !== "scenes");
    document.getElementById("pane-metadata").classList.toggle("hidden", pane !== "metadata");
  });

  // ── Subtitle pane ─────────────────────────────────────────────────────────
  function loadSubtitles() {
    const pane = document.getElementById("pane-subtitles");
    fetch(`/api/transcript?video_path=${vp}`)
      .then(r => r.json())
      .then(data => {
        if (!data.segments || data.segments.length === 0) {
          pane.innerHTML = `<div class="state-msg"><p>${t("video.noSubtitle")}</p></div>`;
          return;
        }
        // Update video name from first segment's video_path-derived info
        const rows = data.segments.map(seg => {
          const active = startSec > 0 && Math.abs(seg.start - startSec) < 0.5;
          return `<div class="sub-row${active ? " active" : ""}" data-start="${seg.start}">
            <span class="sub-ts">${escHtml(seg.timestamp)}</span>
            <span class="sub-text">${escHtml(seg.text)}</span>
          </div>`;
        }).join("");
        pane.innerHTML = rows;
        const activeRow = pane.querySelector(".sub-row.active");
        if (activeRow) setTimeout(() => activeRow.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
      })
      .catch(() => {
        pane.innerHTML = `<div class="state-msg"><p>${t("video.errSubtitle")}</p></div>`;
      });
  }

  // Click on subtitle row → seek player
  document.getElementById("pane-subtitles").addEventListener("click", e => {
    const row = e.target.closest(".sub-row");
    if (!row) return;
    const t = parseFloat(row.dataset.start) || 0;
    player.currentTime = t;
    player.play().catch(() => {});
    document.querySelectorAll("#pane-subtitles .sub-row").forEach(r => r.classList.remove("active"));
    row.classList.add("active");
  });

  // ── Scenes pane ───────────────────────────────────────────────────────────
  let scenesLoaded = false;

  function loadScenes() {
    if (scenesLoaded) return;
    scenesLoaded = true;
    const pane = document.getElementById("pane-scenes");
    fetch(`/api/scenes?video_path=${vp}`)
      .then(r => r.json())
      .then(data => {
        if (!data.segments || data.segments.length === 0) {
          pane.innerHTML = `<div class="state-msg"><p>${t("video.noScenes")}</p></div>`;
          return;
        }
        const rows = data.segments.map(seg => `
          <div class="scene-row" data-start="${seg.start}">
            <span class="scene-ts">${escHtml(seg.timestamp)}</span>
            <span class="scene-desc">${escHtml(seg.description)}</span>
          </div>`).join("");
        pane.innerHTML = rows;
      })
      .catch(() => {
        pane.innerHTML = `<div class="state-msg"><p>${t("video.errScenes")}</p></div>`;
      });
  }

  // Lazy-load scenes when that tab is clicked
  document.querySelector(".detail-tab-bar").addEventListener("click", e => {
    const tab = e.target.closest(".detail-tab");
    if (tab && tab.dataset.pane === "scenes") loadScenes();
    if (tab && tab.dataset.pane === "metadata") loadMetadata();
  });

  // ── Metadata pane ─────────────────────────────────────────────────────────
  let metadataLoaded = false;

  function fmtBytes(n) {
    if (!n && n !== 0) return "—";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
  }
  function fmtDuration(s) {
    if (!s && s !== 0) return "—";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return h > 0 ? `${h}h ${m}m ${sec}s` : `${m}m ${sec}s`;
  }
  function metaRow(label, value) {
    return `<div class="meta-row"><span class="meta-label">${escHtml(label)}</span><span class="meta-value">${escHtml(value ?? "—")}</span></div>`;
  }

  function metaHtml(data) {
    if (data.error) return `<div class="state-msg"><p>${t("video.errMetadata")}</p></div>`;
    let html = `<div class="meta-group"><h3>${t("video.metaGeneral")}</h3>`;
    html += metaRow(t("video.metaFile"), data.file_name);
    html += metaRow(t("video.metaSize"), fmtBytes(data.size));
    html += metaRow(t("video.metaDuration"), fmtDuration(data.duration));
    html += metaRow(t("video.metaFormat"), data.format_name);
    html += metaRow(t("video.metaBitrate"), data.bit_rate ? `${Math.round(data.bit_rate / 1000)} kbps` : "—");
    html += `</div>`;
    if (data.video) {
      html += `<div class="meta-group"><h3>${t("video.metaVideo")}</h3>`;
      html += metaRow(t("video.metaCodec"), data.video.codec);
      html += metaRow(t("video.metaResolution"), data.video.width && data.video.height ? `${data.video.width}×${data.video.height}` : "—");
      html += metaRow(t("video.metaFps"), data.video.fps ? `${data.video.fps} fps` : "—");
      html += metaRow(t("video.metaBitrate"), data.video.bit_rate ? `${Math.round(data.video.bit_rate / 1000)} kbps` : "—");
      html += metaRow(t("video.metaPixFmt"), data.video.pix_fmt);
      html += `</div>`;
    }
    if (data.audio) {
      html += `<div class="meta-group"><h3>${t("video.metaAudio")}</h3>`;
      html += metaRow(t("video.metaCodec"), data.audio.codec);
      html += metaRow(t("video.metaSampleRate"), data.audio.sample_rate ? `${data.audio.sample_rate} Hz` : "—");
      html += metaRow(t("video.metaChannels"), data.audio.channels);
      html += metaRow(t("video.metaBitrate"), data.audio.bit_rate ? `${Math.round(data.audio.bit_rate / 1000)} kbps` : "—");
      html += `</div>`;
    }
    return html;
  }

  const metaCache = {}; // token -> parsed metadata response
  function showMetadataFor(pane, path, token) {
    if (metaCache[token]) { pane.innerHTML = metaCache[token]; return; }
    pane.innerHTML = loading();
    fetch(`/api/metadata?video_path=${encodeURIComponent(path)}`)
      .then(r => r.json())
      .then(data => {
        const html = metaHtml(data);
        metaCache[token] = html;
        pane.innerHTML = html;
      })
      .catch(() => {
        pane.innerHTML = `<div class="state-msg"><p>${t("video.errMetadata")}</p></div>`;
      });
  }

  function loadMetadata() {
    if (metadataLoaded) return;
    metadataLoaded = true;
    const pane = document.getElementById("pane-metadata");
    fetchResolutionVariants().then(variants => {
      if (!variants.length) {
        showMetadataFor(pane, videoPath, "_");
        return;
      }
      if (variants.length === 1) {
        showMetadataFor(pane, variants[0].path, variants[0].token);
        return;
      }
      const wrap = document.createElement("div");
      const tabBar = document.createElement("div");
      tabBar.className = "res-tab-bar";
      tabBar.innerHTML = variants.map((v, i) =>
        `<button class="res-tab${i === 0 ? " active" : ""}" data-token="${escHtml(v.token)}" data-path="${escHtml(v.path)}">${escHtml(v.label)}</button>`
      ).join("");
      const body = document.createElement("div");
      body.className = "res-tab-body";
      wrap.appendChild(tabBar);
      wrap.appendChild(body);
      pane.innerHTML = "";
      pane.appendChild(wrap);
      tabBar.addEventListener("click", e => {
        const btn = e.target.closest(".res-tab");
        if (!btn) return;
        tabBar.querySelectorAll(".res-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        showMetadataFor(body, btn.dataset.path, btn.dataset.token);
      });
      showMetadataFor(body, variants[0].path, variants[0].token);
    }).catch(() => {
      pane.innerHTML = `<div class="state-msg"><p>${t("video.errMetadata")}</p></div>`;
    });
  }

  // ── Video metadata → fill header info ─────────────────────────────────────
  fetch(`/api/videos`).then(r => r.json()).then(list => {
    const v = list.find(x => x.video_path === videoPath);
    if (!v) return;
    document.getElementById("detail-name").textContent   = v.video_name || videoPath;
    document.getElementById("detail-folder").textContent = v.folder && v.folder !== "." ? dispFolder(v.folder) : "(raiz)";
    document.title = v.video_name || "Vídeo";
  }).catch(() => {
    // Fallback: derive name from path
    const parts = videoPath.split("/");
    document.getElementById("detail-name").textContent = parts[parts.length - 1] || videoPath;
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  if (videoPath) loadSubtitles();
</script>
</body>
</html>
